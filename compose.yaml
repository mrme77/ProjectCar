services:
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: projectcar-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-projectcar}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-projectcar-development-only}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  rabbitmq_data:
